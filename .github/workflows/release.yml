name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  release:
    # Publishes ONLY from the public repo — same guard as ci.public.yml. A tag pushed in the
    # private tickmarkr-dev repo skips this job entirely instead of attempting a doomed publish.
    if: github.repository == 'alzahrani-khalid/tickmarkr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      # OBS-148: serialize the suite on the 2-core hosted runner. Under default vitest
      # parallelism the driver timing tests starve nondeterministically (four distinct
      # tests lost the race across three release rounds on 2026-07-24); every serialized
      # context is always green. The product already honors this env (FORK_CAP_ENV).
      - run: npm test
        env:
          VITEST_MAX_FORKS: "1"
      - run: npm publish --provenance --access public
