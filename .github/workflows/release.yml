name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  release:
    # Publishes ONLY from the public repo — same guard as ci.public.yml. A tag pushed in the
    # private tickmarkr-dev repo skips this job entirely instead of attempting a doomed publish.
    if: github.repository == 'alzahrani-khalid/tickmarkr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      # OBS-148 (release-runner CPU-starvation finding, 2026-07-24) serialized the full
      # suite here; since then the suite outgrew the 2-core runner's fixed 60s vitest
      # worker->host RPC window: four consecutive 2026-08-11 runs (ci.public.yml coverage
      # on both platforms, and this workflow's own npm test) ended with every test green
      # and then died at teardown with `[vitest-worker]: Timeout calling "onTaskUpdate"` —
      # vitest's bundled birpc DEFAULT_TIMEOUT=6e4 has no override and is fixed upstream
      # only in vitest 4.x (.planning/EVIDENCE-1890-CYCLE2-RED.md).
      # That teardown timeout is genuine, but it does not establish full-suite green:
      # release trees have also carried genuine assertion failures this artifact-scoped
      # subset does not run. On v2.1.2, three such failures sat beside the timeout with
      # the same failures on ubuntu and macOS. This gate therefore proves only the artifact
      # scope it runs — build, lint, and the built-CLI/signal suites that exercise dist/ —
      # while full-suite truth lives in ci.public.yml and must be green before the tag.
      - run: npx vitest run --project built-cli --project signal-reaper
        env:
          TICKMARKR_SWEEP_TIMEOUT_MS: "900000"
          VITEST_MAX_FORKS: "1"
      - run: npm publish --provenance --access public
