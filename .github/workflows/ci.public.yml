# The public tree's CI — shipped by the export in place of the private ci.yml, which the export
# excludes because its selftest job invokes the private export script that never ships.
# Everything here runs against the checked-out tree on its own: no private files, no secrets,
# no agent CLIs. No paths-ignore: documentation-only PRs get a conclusive check too.
name: CI (public)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Runs ONLY in the public repo. This file is tracked privately (the export ships it),
    # but in the private tree the manifest suite would correctly fail against .planning/
    # and every private push would bill a second full CI run. After the launch rename the
    # private repo is tickmarkr-dev, so the canonical name selects the public repo alone.
    if: github.repository == 'alzahrani-khalid/tickmarkr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      # Full-suite proof in TWO invocations (OBS-829, measured 2026-09-01/02 on four collapses): a
      # host stall on the 2-core runner times out a parallel `suite` worker's onTaskUpdate rpc and
      # vitest throws BEFORE dispatching the three single-fork projects, whose files then vanish
      # unnamed and unfailed. Running those three in their own `if: always()` invocation means a
      # throw in `suite` cannot lose them, and the count oracle sums both logs against the tracked
      # tree. OBS-156: serialize on the 2-core hosted runner. OBS-148 fixed release.yml only, so
      # this job starved a different load-sensitive test on every release (v1.78 herdr READINESS,
      # v1.79 daemon tip-verify artifact) while Release passed on the identical commit.
      - name: Run coverage proof (parallel suite project)
        shell: bash
        run: |
          set -o pipefail
          npm run test:coverage -- --project suite 2>&1 | tee "$RUNNER_TEMP/tickmarkr-test-output.log"
        env:
          TICKMARKR_CI_LEAN_REPORTERS: "1"
          VITEST_MAX_FORKS: "1"
          TICKMARKR_SWEEP_TIMEOUT_MS: "900000"
      - name: Run single-fork projects (independent of the step above)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          npx vitest run --project sync-heavy --project built-cli --project signal-reaper 2>&1 | tee "$RUNNER_TEMP/tickmarkr-test-output-singlefork.log"
        env:
          TICKMARKR_CI_LEAN_REPORTERS: "1"
          VITEST_MAX_FORKS: "1"
          TICKMARKR_SWEEP_TIMEOUT_MS: "900000"
      - name: Assert collected test-file count
        if: always()
        run: sh scripts/assert-test-file-count.sh "$RUNNER_TEMP/tickmarkr-test-output.log" "$RUNNER_TEMP/tickmarkr-test-output-singlefork.log"

  test-macos:
    if: github.repository == 'alzahrani-khalid/tickmarkr'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      # Same two-invocation proof and serialization as ubuntu (the lane-equality test pins it).
      - name: Run coverage proof (parallel suite project)
        shell: bash
        run: |
          set -o pipefail
          npm run test:coverage -- --project suite 2>&1 | tee "$RUNNER_TEMP/tickmarkr-test-output.log"
        env:
          TICKMARKR_CI_LEAN_REPORTERS: "1"
          VITEST_MAX_FORKS: "1"
          TICKMARKR_SWEEP_TIMEOUT_MS: "900000"
      - name: Run single-fork projects (independent of the step above)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          npx vitest run --project sync-heavy --project built-cli --project signal-reaper 2>&1 | tee "$RUNNER_TEMP/tickmarkr-test-output-singlefork.log"
        env:
          TICKMARKR_CI_LEAN_REPORTERS: "1"
          VITEST_MAX_FORKS: "1"
          TICKMARKR_SWEEP_TIMEOUT_MS: "900000"
      - name: Assert collected test-file count
        if: always()
        run: sh scripts/assert-test-file-count.sh "$RUNNER_TEMP/tickmarkr-test-output.log" "$RUNNER_TEMP/tickmarkr-test-output-singlefork.log"
