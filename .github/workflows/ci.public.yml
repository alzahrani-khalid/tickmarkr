# The public tree's CI — shipped by the export in place of the private ci.yml, which the export
# excludes because its selftest job invokes the private export script that never ships.
# Everything here runs against the checked-out tree on its own: no private files, no secrets,
# no agent CLIs. No paths-ignore: documentation-only PRs get a conclusive check too.
name: CI (public)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Runs ONLY in the public repo. This file is tracked privately (the export ships it),
    # but in the private tree the manifest suite would correctly fail against .planning/
    # and every private push would bill a second full CI run. After the launch rename the
    # private repo is tickmarkr-dev, so the canonical name selects the public repo alone.
    if: github.repository == 'alzahrani-khalid/tickmarkr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      # full suite, coverage-gated — includes the export-boundary manifest suite, which in the
      # public tree validates the current git index and never skips
      # OBS-156: serialize on the 2-core hosted runner. OBS-148 fixed release.yml only, so this
      # job starved a different load-sensitive test on every release (v1.78 herdr READINESS,
      # v1.79 daemon tip-verify artifact) while Release passed on the identical commit.
      # Report-26: the sync-heavy project runs as its own serial step below, so the main
      # suite's single worker never carries the birpc-starving members.
      - run: npm run test:coverage -- --project suite --project built-cli --project signal-reaper
        env:
          TICKMARKR_CI_LEAN_REPORTERS: "1"
          VITEST_MAX_FORKS: "1"
          TICKMARKR_SWEEP_TIMEOUT_MS: "900000"
      # RULING-1890-CI-DESIGN option (c): the birpc-starver class members with a produced CI
      # red, in their own serial step with a generous timeout (project sync-heavy,
      # vitest.config.ts). NOT an absorber: a new red here that is not the birpc class goes
      # back to classification, never into the timeout.
      - run: npx vitest run --project sync-heavy
        env:
          TICKMARKR_SWEEP_TIMEOUT_MS: "900000"

  test-macos:
    if: github.repository == 'alzahrani-khalid/tickmarkr'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      # OBS-156: same serialization as the ubuntu job — macos hosted runners are 2-core too
      - run: npm run test:coverage -- --project suite --project built-cli --project signal-reaper
        env:
          TICKMARKR_CI_LEAN_REPORTERS: "1"
          VITEST_MAX_FORKS: "1"
          TICKMARKR_SWEEP_TIMEOUT_MS: "900000"
      # same serial sync-heavy step as the ubuntu job (RULING-1890-CI-DESIGN option c)
      - run: npx vitest run --project sync-heavy
        env:
          TICKMARKR_SWEEP_TIMEOUT_MS: "900000"
